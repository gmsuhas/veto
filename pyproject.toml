[project]
name = "veto-check"
version = "0.1.0"
description = "A long-call checklist that returns pass, fail, or watchlist, as a command and as an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Suhas Manjunath" }]
keywords = ["mcp", "mcp-server", "checklist"]
dependencies = []

[project.urls]
Homepage = "https://github.com/gmsuhas/veto"
Repository = "https://github.com/gmsuhas/veto"

[project.scripts]
veto = "veto.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veto*"]
